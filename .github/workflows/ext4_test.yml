name: ext4 test
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  ext4-test:
    name: Build and check ext4 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bazel with shared caching
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Install e2fsprogs
        # The test inspects the image with debugfs and tune2fs from the host.
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image and check its content
        working-directory: tests
        run: |
          bazel test --config=x86_64-linux-ext4 --test_output=errors //linux/ext4:ext4_test
