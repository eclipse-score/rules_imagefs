name: QNX IFS test
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  qnx-ifs-test:
    name: Build and boot QNX IFS image
    # Pull requests from forks don't get the secrets that this job needs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Read access to eclipse-score/qnx_sdp_pkg for the QNX SDP release asset
      GH_TOKEN: ${{ secrets.SCORE_BOT_QNX_PKG_PAT }}
    steps:
      - name: Clean disk space
        uses: eclipse-score/more-disk-space@v1
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bazel with shared caching
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Prepare QNX license
        env:
          SCORE_QNX_LICENSE: ${{ secrets.SCORE_QNX_LICENSE }}
        run: |
          set -euo pipefail

          LICENSE_DIR="/opt/score_qnx/license"
          sudo mkdir -p "${LICENSE_DIR}"
          echo "${SCORE_QNX_LICENSE}" | base64 --decode | sudo tee "${LICENSE_DIR}/licenses" >/dev/null
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the image and boot it in QEMU
        working-directory: tests
        run: |
          bazel test --config=x86_64-qnx-ifs --test_output=errors //qnx/ifs:ifs_test
      - name: Cleanup QNX license
        if: always()
        run: sudo rm -rf /opt/score_qnx
